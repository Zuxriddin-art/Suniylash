<style>
  /* Reference Sans / Display are used when installed; otherwise Onest (Latin + Cyrillic). */
  @font-face {
    font-family: "Reference Sans";
    src: local("Reference Sans");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Reference Display";
    src: local("Reference Display");
    font-weight: 400 900;
    font-display: swap;
  }

  :root {
    font-family: "Reference Sans", Onest, Arial, sans-serif;
    color-scheme: dark;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-line: cubic-bezier(.22, 1, .36, 1);
    --glass-border: rgba(255,255,255,.14);
    --glass-bg: linear-gradient(145deg, rgba(24,30,32,.80), rgba(6,12,14,.88));
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; padding: 0; margin: 0; -webkit-tap-highlight-color: transparent; }
  img, svg, video { display: block; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  body { overflow-x: hidden; }
  body.sheet-open { overflow: hidden; }

  /* ---------- Frame ---------- */
  .viewport {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 520px;
    isolation: isolate;
    overflow: hidden;
    background: #000;
  }
  .screen {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    background: #000;
    overflow: hidden;

    --gutter-start: clamp(36px, 4.177vw, 96px);
    --gutter-end: clamp(36px, 4.04vw, 96px);
    --header-top: clamp(20px, 2.264vh, 30px);
    --hero-bottom: clamp(34px, 5.19vh, 64px);
    --display-size: clamp(58px, 7.64vh, 88px);
    --display-leading: clamp(72px, 9.34vh, 106px);
    --copy-size: clamp(14px, 1.70vh, 19px);
    --copy-leading: clamp(19px, 2.17vh, 24px);
    --title-copy-gap: clamp(15px, 2.08vh, 24px);
    --copy-cta-gap: clamp(24px, 3.11vh, 36px);
    --cta-width: clamp(142px, 15.09vh, 168px);
    --cta-height: clamp(38px, 3.96vh, 44px);
    --compact-control-font-size: clamp(17px, 1.75vh, 19px);
    --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
    --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
    --control-inline-nudge: -1px;
    --control-baseline-shift: clamp(1px, .19vh, 2px);
    --copy-optical-shift: clamp(0px, .1vh, 1px);
    --watch-baseline-shift: clamp(2px, .38vh, 4px);
    --card-width: clamp(150px, 18.96vh, 215px);
  }
  .background {
    position: absolute;
    inset: 0;
    z-index: -3;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
      radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
  }

  /* ---------- Header ---------- */
  .header {
    position: absolute;
    inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
    z-index: 10;
    height: 48px;
    display: flex;
    align-items: flex-start;
    white-space: nowrap;
  }
  .brand {
    position: relative;
    top: 8px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
    font-size: 17px;
    font-weight: 560;
    letter-spacing: -.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  .brand img { flex: none; width: auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .brand-mark { height: 30px; }
  .brand-word { height: 16px; }
  /* Desktop: the collapsible panel dissolves so its children sit in the header row. */
  .header-actions { display: contents; }
  .nav {
    order: 1;
    position: relative;
    top: 9px;
    display: flex;
    gap: clamp(32px, 2.9vw, 43px);
    margin-left: clamp(36px, 3.03vw, 48px);
  }
  .nav a {
    position: relative;
    font-size: 16px;
    line-height: 20px;
    font-weight: 430;
    letter-spacing: -.36px;
    color: rgba(229,229,230,.77);
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  .nav a:nth-child(1) { top: -3px; }
  .nav a:nth-child(4) { margin-left: 1px; }
  .nav a[aria-current="page"] { color: #fff; }
  .nav a[aria-current="page"]::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -7px;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,.82);
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .lang {
    order: 3;
    flex: none;
    display: flex;
    gap: 2px;
    height: 42px;
    margin-top: 3px;
    margin-left: auto;
    padding: 4px;
    border: 1px solid var(--glass-border);
    border-radius: 9px;
    background: var(--glass-bg);
    box-shadow: 0 1px 5px rgba(0,0,0,.34), 0 0 0 2px rgba(255,255,255,.03) inset;
    -webkit-backdrop-filter: blur(14px) saturate(108%);
    backdrop-filter: blur(14px) saturate(108%);
  }
  .lang button {
    min-width: 36px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    font-size: 13px;
    font-weight: 560;
    letter-spacing: .2px;
    color: rgba(229,229,230,.7);
  }
  .lang button[aria-pressed="true"] { background: #fff; color: #101010; }
  .sign-up {
    order: 4;
    flex: none;
    min-width: 109px;
    height: 42px;
    margin-top: 3px;
    margin-left: clamp(12px, 1.1vw, 18px);
    padding: 0 18px;
    border: 0;
    border-radius: 7px;
    background: #fff;
    color: #101010;
    font-size: var(--compact-control-font-size);
    font-weight: 460;
    letter-spacing: -.34px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
  }
  .sign-up span {
    position: relative;
    left: var(--control-inline-nudge);
    top: var(--control-baseline-shift);
  }

  /* Glass: menu toggle (hidden on desktop) */
  .menu-toggle {
    order: 5;
    display: none;
    flex: none;
    place-items: center;
    width: 46px;
    height: 46px;
    margin-top: 1px;
    margin-left: 8px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 11px;
    color: #fff;
    background: linear-gradient(145deg, rgba(26,34,36,.72), rgba(8,14,16,.8));
    box-shadow: 0 2px 10px rgba(0,0,0,.36), 0 0 0 2px rgba(255,255,255,.03) inset;
    -webkit-backdrop-filter: blur(14px) saturate(108%);
    backdrop-filter: blur(14px) saturate(108%);
  }
  .menu-toggle .bar {
    transform-origin: 12px 12px;
    transition: transform 320ms var(--ease-out);
  }
  .header.menu-open .menu-toggle .bar-top { transform: rotate(45deg) translateY(3px); }
  .header.menu-open .menu-toggle .bar-bottom { transform: rotate(-45deg) translateY(-3px); }

  /* ---------- Hero ---------- */
  .hero { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .hero > * { pointer-events: auto; }
  .hero-content {
    position: absolute;
    left: var(--gutter-start);
    bottom: var(--hero-bottom);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-title {
    --fit: 1;
    margin: 0;
    font-family: "Reference Display", "Reference Sans", Onest, Arial, sans-serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: calc(var(--display-size) * var(--fit));
    line-height: calc(var(--display-leading) * var(--fit));
    letter-spacing: -2.1px;
    -webkit-text-stroke: .12px currentColor;
    white-space: nowrap;
    text-shadow: 0 2px 2px rgba(0,0,0,.44);
  }
  .line { display: block; transform-origin: left center; }
  .line-reveal { display: inline-block; }
  .line-one { color: #fff; transform: scaleX(.775); }
  .line-two { color: rgba(211, 207, 207, .78); transform: scaleX(.793); }
  .hero-copy {
    position: relative;
    left: 1px;
    top: var(--copy-optical-shift);
    width: clamp(390px, 31.67vw, 500px);
    margin: var(--title-copy-gap) 0 0;
    font-size: var(--copy-size);
    line-height: var(--copy-leading);
    font-weight: 350;
    letter-spacing: .13px;
    color: rgba(226, 229, 228, .84);
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .primary-cta {
    position: relative;
    flex: none;
    display: inline-flex;
    align-items: center;
    min-width: var(--cta-width);
    height: var(--cta-height);
    margin-top: var(--copy-cta-gap);
    padding: 0 calc(var(--cta-height) * .75 + 26px) 0 13px;
    border: 0;
    border-radius: 7px;
    background: #fff;
    color: #111;
    font-size: var(--primary-control-font-size);
    box-shadow: 0 1px 5px rgba(0,0,0,.38);
  }
  .primary-cta .label {
    position: relative;
    left: var(--control-inline-nudge);
    top: var(--control-baseline-shift);
    font-weight: 450;
    letter-spacing: -.3px;
    line-height: 1;
    white-space: nowrap;
  }
  .arrow-box {
    position: absolute;
    right: 5px;
    top: 14.286%;
    height: 71.429%;
    aspect-ratio: 33 / 31.4;
    border-radius: 7px;
    background: #070909;
    display: grid;
    place-items: center;
  }

  /* ---------- Work card (glass) ---------- */
  .demo-card {
    position: absolute;
    right: var(--gutter-end);
    bottom: var(--hero-bottom);
    width: var(--card-width);
    aspect-ratio: 201 / 265;
    container-type: inline-size;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: clamp(12px, 1.52vh, 18px);
    background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
    box-shadow:
      0 2px 10px rgba(0,0,0,.44),
      0 0 0 3px rgba(255,255,255,.035) inset,
      0 0 0 1px rgba(0,0,0,.9);
    -webkit-backdrop-filter: blur(14px) saturate(108%);
    backdrop-filter: blur(14px) saturate(108%);
  }
  .demo-visual {
    position: absolute;
    left: 3.5cqw;
    top: 4cqw;
    width: 92.5cqw;
    height: 92cqw;
    border-radius: 4cqw;
    overflow: hidden;
    background: #101a1e;
  }
  .demo-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.89) saturate(.93) contrast(1.03);
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }
  .play {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 29cqw;
    height: 29cqw;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255,255,255,.34);
    border-radius: 50%;
    background: rgba(3,5,7,.47);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
  }
  .play svg { width: 38%; height: 38%; margin-left: 6%; }
  .watch-button {
    position: absolute;
    left: 3.5cqw;
    width: 92.5cqw;
    top: 100cqw;
    bottom: 4cqw;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.21);
    border-radius: 3.5cqw;
    background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    font-size: min(var(--action-control-font-size), 11.5cqw);
    font-weight: 430;
    letter-spacing: -.3px;
    color: #fff;
    white-space: nowrap;
  }
  .watch-button span {
    position: relative;
    left: var(--control-inline-nudge);
    top: calc(var(--watch-baseline-shift) * .5);
  }

  /* ---------- Shared section type ---------- */
  .eyebrow { font-size: 12.5px; font-weight: 560; letter-spacing: .16em; text-transform: uppercase; color: rgba(240,240,240,.55); }
  .block {
    max-width: 1320px;
    margin: 0 auto;
    padding: clamp(72px, 12vh, 140px) clamp(20px, 4.1vw, 96px) 0;
  }
  .block-head { max-width: 640px; margin-bottom: clamp(28px, 4.5vh, 48px); }
  .block-title {
    width: 122%;
    margin: 12px 0 0;
    font-family: "Reference Display", "Reference Sans", Onest, Arial, sans-serif;
    font-size: clamp(40px, 5.6vw, 76px);
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -1.6px;
    transform: scaleX(.82);
    transform-origin: left center;
  }
  .block-sub { max-width: 520px; margin: 14px 0 0; font-size: 16px; line-height: 24px; font-weight: 350; color: rgba(226,229,228,.72); }

  /* ---------- Global statement (video background) ---------- */
  .statement {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 96px 20px;
    overflow: hidden;
    isolation: isolate;
    text-align: center;
    --cta-width: 168px;
    --cta-height: 46px;
    --primary-control-font-size: 17px;
    --control-inline-nudge: -1px;
    --control-baseline-shift: 1px;
  }
  .statement-video {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .statement::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(180deg, #000 0%, transparent 18%, transparent 82%, #000 100%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.28), rgba(0,0,0,.72) 78%);
  }
  .statement-inner { display: grid; justify-items: center; max-width: 960px; }
  .statement-title {
    margin: 16px 0 0;
    font-family: "Reference Display", "Reference Sans", Onest, Arial, sans-serif;
    font-size: clamp(44px, 7vw, 104px);
    font-weight: 500;
    line-height: 1.04;
    letter-spacing: -2px;
    -webkit-text-stroke: .12px currentColor;
    text-shadow: 0 2px 2px rgba(0,0,0,.44);
  }
  .statement-title .line { transform-origin: center; }
  .statement-title .line-one { transform: scaleX(.8); }
  .statement-title .line-two { transform: scaleX(.8); }
  .statement-copy {
    max-width: 560px;
    margin: 22px 0 0;
    font-size: clamp(15px, 1.25vw, 18px);
    line-height: 1.55;
    font-weight: 350;
    letter-spacing: .13px;
    color: rgba(226,229,228,.86);
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .statement .primary-cta { margin-top: 30px; }

  /* ---------- Creations ---------- */
  .creations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 1.6vw, 24px); }
  .creation { margin: 0; cursor: pointer; }
  .film-frame {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
    box-shadow: 0 2px 10px rgba(0,0,0,.44), 0 0 0 3px rgba(255,255,255,.035) inset;
  }
  .film-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.4));
  }
  .creation-video { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
  .creation.is-vertical .film-frame::before {
    content: "";
    position: absolute;
    inset: -24px;
    background: var(--poster) center / cover;
    filter: blur(26px) brightness(.5);
  }
  .creation.is-vertical .creation-video { object-fit: contain; }
  .creation.is-empty { cursor: default; }
  .creation-soon {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 14px;
    background:
      radial-gradient(120% 80% at 25% 15%, rgba(214,120,60,.32), transparent 60%),
      radial-gradient(120% 80% at 85% 90%, rgba(140,30,80,.42), transparent 60%),
      #0b0a0c;
    color: rgba(240,240,240,.72);
    font-size: 14px;
    font-weight: 460;
    letter-spacing: .04em;
  }
  .creation-soon img { width: 40px; height: auto; }
  .sound-toggle {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 2;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    background: rgba(3,5,7,.5);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .sound-toggle .on, .creation.is-unmuted .sound-toggle .off { display: none; }
  .creation.is-unmuted .sound-toggle .on { display: block; }

  /* ---------- Footer ---------- */
  .site-footer {
    max-width: 1320px;
    margin: 0 auto;
    padding: clamp(96px, 16vh, 180px) clamp(20px, 4.1vw, 96px) 28px;
    --cta-width: 168px;
    --cta-height: 46px;
    --primary-control-font-size: 17px;
    --control-inline-nudge: -1px;
    --control-baseline-shift: 1px;
  }
  .footer-cta {
    display: grid;
    justify-items: center;
    padding-bottom: clamp(56px, 9vh, 96px);
    border-bottom: 1px solid rgba(255,255,255,.1);

  .footer-cta .block-title { width: auto; max-width: 900px; margin: 0; font-size: clamp(34px, 4.6vw, 64px); transform: none; }
  .footer-cta .primary-cta { margin-top: 28px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 32px; padding: 44px 0; }
  .footer-logo { display: flex; align-items: center; gap: 9px; }
  .footer-logo img:first-child { height: 30px; width: auto; }
  .footer-logo img:last-child { height: 16px; width: auto; }
  .footer-brand p { max-width: 320px; margin: 14px 0 0; font-size: 14px; line-height: 21px; color: rgba(226,229,228,.6); }
  .footer-col { display: grid; align-content: start; gap: 12px; font-size: 15px; }
  .footer-col > a { color: rgba(229,229,230,.8); }
  .footer-head { margin-bottom: 4px; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(240,240,240,.45); }
  .social {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    background: var(--glass-bg);

  .social .ico { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: rgba(255,255,255,.06); }
  .social small { display: block; font-size: 12.5px; color: rgba(240,240,240,.5); }
  .footer-bottom {
    display: flex;

    gap: 16px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.1);
    font-size: 13px;
    color: rgba(240,240,240,.4);

  /* ---------- Order sheet (glass) ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,.42);
    opacity: 0;
    visibility: hidden;
    transition: opacity 260ms var(--ease-out), visibility 0s linear 260ms;
  }
  .sheet {
    position: fixed;
    z-index: 41;
    top: var(--sheet-top, 20px);
    right: var(--sheet-side, 20px);
    bottom: var(--sheet-top, 20px);
    width: min(460px, calc(100vw - 2 * var(--sheet-side, 20px)));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(22,28,30,.84), rgba(5,11,13,.92));
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.03) inset;
    -webkit-backdrop-filter: blur(18px) saturate(110%);
    backdrop-filter: blur(18px) saturate(110%);
    opacity: 0;
    visibility: hidden;
    transform: translate3d(14px, 0, 0) scale(.985);

  .field-label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 520; letter-spacing: .1px; color: rgba(240,240,240,.77); }
  .field-label .opt { font-weight: 380; color: rgba(240,240,240,.5); }
  .pkgs { display: grid; gap: 8px; }
  .pkg { position: relative; display: block; cursor: pointer; }
  .pkg input, .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .pkg-body {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;

  .pkg-name { font-size: 16px; font-weight: 560; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
  .pkg-tag { font-size: 11px; font-weight: 560; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); }
  .pkg-price { font-size: 15px; font-weight: 560; text-align: right; font-variant-numeric: tabular-nums; }
  .pkg-price small { font-weight: 400; color: rgba(240,240,240,.6); }
  .pkg-feat { grid-column: 1 / -1; font-size: 13px; line-height: 18px; font-weight: 350; color: rgba(226,229,228,.7); }
  .pkg input:checked + .pkg-body { border-color: rgba(255,255,255,.62); background: rgba(255,255,255,.08); }
  .pkg input:focus-visible + .pkg-body, .chips input:focus-visible + span { outline: 2px solid #fff; outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    padding: 9px 13px;

  .input {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 9px;
    background: rgba(255,255,255,.04);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 400;
    outline: none;
    transition: border-color 140ms ease, background 140ms ease;
  }
  textarea.input { height: 84px; padding: 11px 13px; resize: none; }
  .input::placeholder { color: rgba(240,240,240,.38); }
  .input:focus { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.07); }
  .input[aria-invalid="true"] { border-color: #ff6b6b; }
  .form-error { margin: -4px 0 0; font-size: 13px; color: #ff8a8a; min-height: 0; }
  .form-error:empty { display: none; }
  .submit {
    margin-top: 4px;
    width: 100%;
    height: 50px;
    padding: 0 60px 0 16px;
    font-size: 17px;
    justify-content: flex-start;
  }
  .form-hint { margin: 0; text-align: center; font-size: 12.5px; font-weight: 350; color: rgba(226,229,228,.6); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .sent { display: none; padding: 28px 0 8px; text-align: center; }
  .sheet.sent-done .sent { display: grid; justify-items: center; }
  .sheet.sent-done form { display: none; }
  .sent-mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: #fff; }
  .sent h3 {
    margin: 18px 0 0;
    font-family: "Reference Display", "Reference Sans", Onest, Arial, sans-serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -.6px;
  }
  .sent p { max-width: 320px; margin: 8px 0 22px; font-size: 14.5px; line-height: 21px; font-weight: 350; color: rgba(226,229,228,.74); }
  .sent .ghost { width: 100%; }
  .submit:disabled { opacity: .7; cursor: wait; }
  .success { display: none; }
  .sheet.done .success { display: block; }
  .sheet.done form { display: none; }
  .success pre {
    margin: 0 0 14px;
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 10px;
    background: rgba(255,255,255,.03);
    font: inherit;
    font-size: 14px;
    line-height: 21px;
    font-weight: 380;
    color: rgba(240,240,240,.9);
  }
  .success .btns { display: grid; gap: 8px; }
  .ghost {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    border: 1px solid rgba(255,255,255,.21);
    border-radius: 9px;
    background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
    font-size: 15px;
    font-weight: 460;
  }

  /* ---------- Entrance motion ---------- */
  @keyframes entrance-brand {
    from { opacity: 0; transform: translate3d(0, 7px, 0) scale(.94); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes entrance-nav {

  .motion-pending .brand,
  .motion-pending .nav a,

  .motion-pending .brand { animation: entrance-brand 580ms var(--ease-out) 60ms both; }
  .motion-pending .nav a:nth-child(1) { animation: entrance-nav 480ms var(--ease-out) 130ms both; }

  .motion-pending .nav a:nth-child(3) { animation: entrance-nav 480ms var(--ease-out) 220ms both; }
  .motion-pending .nav a:nth-child(4) { animation: entrance-nav 480ms var(--ease-out) 265ms both; }
  .motion-pending .lang { animation: entrance-action 520ms var(--ease-out) 200ms both; }
  .motion-pending .sign-up { animation: entrance-action 520ms var(--ease-out) 220ms both; }
  .motion-pending .menu-toggle { animation: entrance-action 520ms var(--ease-out) 140ms both; }
  .motion-pending .line-one .line-reveal { animation: entrance-line 800ms var(--ease-line) 300ms both; }
  .motion-pending .line-two .line-reveal { animation: entrance-line 850ms var(--ease-line) 440ms both; }
  .motion-pending .hero-copy { animation: entrance-copy 620ms var(--ease-out) 740ms both; }
  .motion-pending .primary-cta { animation: entrance-action 560ms var(--ease-out) 960ms both; }
  .motion-pending .demo-card {
    transform-origin: 82% 50%;

  @media (prefers-reduced-motion: no-preference) {

  /* ---------- Tablet + mobile: glass dropdown menu ---------- */
  @media (max-width: 790px), (max-width: 1100px) and (orientation: portrait) {

    .brand-mark { height: 27px; }

        <span class="pkg-body">
          <span class="pkg-name">${p.name}${p.tag ? `<span class="pkg-tag">${p.tag}</span>` : ""}</span>
          <span class="pkg-price">${p.price}</span>
          <span class="pkg-feat">${p.feat}</span>
        </span>
      </label>`).join("");
  }

  function setLang(next) {
    lang = I18N[next] ? next : "uz";
    root.lang = lang;
    store.set("suniylash.lang", lang);
    $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $$("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml).replace(/<br>/g, "<br> "); });
    $$("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $$("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    $$(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    renderPackages();
    fitTitle();
  }

  /* Shrink the headline if a language's wording would run past the screen edge. */
  function fitTitle() {
    const title = $(".hero-title");
    title.style.setProperty("--fit", 1);
    const left = parseFloat(getComputedStyle($(".hero-content")).left) || 0;
    const avail = window.innerWidth - left * 2;
    const widest = Math.max(...$$(".line-reveal", title).map((el) => el.getBoundingClientRect().width));
    if (widest > avail) title.style.setProperty("--fit", (avail / widest).toFixed(3));
  }

  /* ---------- Header menu (tablet / mobile) ---------- */
  const header = $(".header");
  const toggle = $(".menu-toggle");
  const panel = $("#tablet-navigation");
  const toggleVisible = () => getComputedStyle(toggle).display !== "none";
  function setMenu(open, focusFirst) {
    header.classList.toggle("menu-open", open);
    toggle.setAttribute("aria-expanded", String(open));
    panel.inert = toggleVisible() && !open;
    if (open && focusFirst) requestAnimationFrame(() => panel.querySelector("a").focus());
  }
  toggle.addEventListener("click", () => setMenu(!header.classList.contains("menu-open"), true));
  panel.addEventListener("click", (e) => {
    if (toggleVisible() && e.target.closest("a, button")) setMenu(false);
  });
  document.addEventListener("pointerdown", (e) => {
    if (header.classList.contains("menu-open") && !header.contains(e.target)) setMenu(false);
  });
  let lastVisible = toggleVisible();
  window.addEventListener("resize", () => {
    const visible = toggleVisible();
    if (visible !== lastVisible) { lastVisible = visible; setMenu(false); }
    fitTitle();
  });

  /* ---------- Order sheet ---------- */
  const sheet = $("#orderSheet");
  const form = $("#orderForm");
  let returnFocus = null;
  function openSheet(pkg) {
    returnFocus = document.activeElement;
    if (pkg) { const r = $(`input[name=package][value="${pkg}"]`); if (r) r.checked = true; }
    document.body.classList.add("sheet-open");
    sheet.inert = false;
    requestAnimationFrame(() => $("#sheetClose").focus());
  }
  function closeSheet() {
    document.body.classList.remove("sheet-open");
    sheet.inert = true;
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  }
  $$("[data-open-order]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); openSheet(); }));
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (document.body.classList.contains("sheet-open")) closeSheet();
      else if (header.classList.contains("menu-open")) { setMenu(false); toggle.focus(); }
    }
    if (e.key === "Tab" && document.body.classList.contains("sheet-open")) {
      const f = $$("a[href], button, input, textarea", sheet).filter((el) => el.offsetParent !== null && !el.disabled);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function buildOrder(fd) {
    const pkg = CONFIG.packages.find((p) => p.id === fd.get("package"));
    const lines = [
      `🎬 ${t("msg.title")} — Suniylash`,
      "",
      `👤 ${t("msg.name")}: ${fd.get("name").trim()}`,
      `📞 ${t("msg.phone")}: ${fd.get("phone").trim()}`,
      `🏪 ${t("msg.business")}: ${fd.get("business").trim()}`,
      `📂 ${t("msg.type")}: ${fd.get("type").trim()}`,
      `📦 ${t("msg.package")}: ${pkg ? `${t(`pk.${pkg.id}.name`)} (${priceText(pkg)})` : t("pk.unsure")}`,
      `🗣 ${t("msg.lang")}: ${t("f.lang." + fd.get("vlang"))}`,
    ];
    const details = fd.get("details").trim();
    if (details) lines.push(`📝 ${t("msg.details")}: ${details}`);
    return lines.join("\n");
  }

  form.addEventListener("input", (e) => {
    if (e.target.matches(".input")) e.target.removeAttribute("aria-invalid");
  });
  // Orders go to the Google Sheet when an endpoint is set; otherwise they open in Telegram.
  const useSheet = Boolean(CONFIG.orderEndpoint);
  if (useSheet) {
    $(".submit .label").dataset.i18n = "f.send";
    $(".form-hint").dataset.i18n = "f.hint.sheet";
    $(".sheet-head p").dataset.i18n = "order.sub.sheet";
  }

  async function sendToSheet(fd) {
    const pkg = CONFIG.packages.find((p) => p.id === fd.get("package"));
    const uz = (k) => I18N.uz[k];
    const body = new URLSearchParams({
      name: fd.get("name").trim(),
      phone: fd.get("phone").trim(),
      business: fd.get("business").trim(),
      type: fd.get("type").trim(),
      package: pkg ? `${uz(`pk.${pkg.id}.name`)} (${pkg.price == null ? uz("pk.custom") : `$${pkg.price}${uz(pkg.unit === "month" ? "pk.month" : "pk.video")}`})` : uz("pk.unsure"),
      vlang: uz("f.lang." + fd.get("vlang")),
      details: fd.get("details").trim(),
      lang: lang,
      website: fd.get("website") || "",
    });
    // Apps Script does not send CORS headers, so the response is opaque; a network error still throws.
    await fetch(CONFIG.orderEndpoint, { method: "POST", mode: "no-cors", body });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const missing = $$("[required]", form).filter((el) => !el.value.trim());
    missing.forEach((el) => el.setAttribute("aria-invalid", "true"));
    if (missing.length) {
      $("#formError").textContent = t("f.required");
      missing[0].focus();
      return;
    }
    $("#formError").textContent = "";
    if (useSheet) {
      const btn = $(".submit");
      const label = btn.querySelector(".label");
      btn.disabled = true;
      label.textContent = t("f.sending");
      try {
        await sendToSheet(new FormData(form));
        sheet.classList.add("sent-done");
        $(".sheet-body").scrollTop = 0;
      } catch {
        $("#formError").textContent = t("f.failed");
      } finally {
        btn.disabled = false;
        label.textContent = t("f.send");
      }
      return;
    }
    const text = buildOrder(new FormData(form));
    const url = tgUrl(text);
    $("#orderText").textContent = text;
    $("#tgAgain").href = url;
    sheet.classList.add("done");
    $(".sheet-body").scrollTop = 0;
    window.location.href = url;
  });
  $("#copyBtn").addEventListener("click", async () => {
    const text = $("#orderText").textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }
    $("#copyBtn").textContent = t("ok.copied");
    setTimeout(() => ($("#copyBtn").textContent = t("ok.copy")), 2000);
  });
  $("#sentNew").addEventListener("click", () => {
    form.reset();
    renderPackages();
    sheet.classList.remove("sent-done");
  });
  $("#newOrder").addEventListener("click", () => {
    form.reset();
    renderPackages();
    sheet.classList.remove("done");
  });

  /* ---------- Videos ---------- */
  // Portrait screens (phones) get the light vertical versions.
  const portrait = matchMedia("(max-aspect-ratio: 1/1)").matches;
  const pick = (v) => (portrait ? { src: v.mobile, poster: v.mobilePoster } : v);
  const heroVideo = $(".background");
  heroVideo.poster = pick(CONFIG.heroVideo).poster;
  heroVideo.src = pick(CONFIG.heroVideo).src;
  heroVideo.play().catch(() => {});

  const soundIcon = `<svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="m17 9 4 6M21 9l-4 6"/></svg><svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
  $("#creationGrid").innerHTML = CONFIG.creations.map((c) => (c
    ? `<figure class="creation${c.vertical ? " is-vertical" : ""}">
        <div class="film-frame" style="--poster: url('${c.poster}')">
          <video class="creation-video" muted loop playsinline preload="none" poster="${c.poster}" data-src="${c.src}"></video>
          <button class="sound-toggle" type="button" data-i18n-aria="cr.sound">${soundIcon}</button>
        </div>
      </figure>`
    : `<figure class="creation is-empty">
        <div class="film-frame"><div class="creation-soon"><img src="assets/logo-mark.png" alt=""><span data-i18n="cr.soon"></span></div></div>
      </figure>`)).join("");

  // Background and creation videos only load and play while on screen.
  const statementVideo = $(".statement-video");
  statementVideo.poster = pick(CONFIG.globalVideo).poster;
  statementVideo.dataset.src = pick(CONFIG.globalVideo).src;
  const lazyVideos = [statementVideo, ...$$(".creation-video")];
  const onScreen = new IntersectionObserver((entries) => {
    entries.forEach(({ target, isIntersecting }) => {
      if (isIntersecting) {
        if (!target.getAttribute("src")) target.src = target.dataset.src;
        target.play().catch(() => {});
      } else {
        target.pause();
      }
    });
  }, { threshold: 0.2 });
  lazyVideos.forEach((v) => onScreen.observe(v));

  // Tapping a creation turns its sound on (and every other one off).
  $("#creationGrid").addEventListener("click", (e) => {
    const card = e.target.closest(".creation:not(.is-empty)");
    if (!card) return;
    const video = card.querySelector("video");
    const unmute = video.muted;
    $$(".creation").forEach((other) => {
      other.classList.remove("is-unmuted");
      const v = other.querySelector("video");
      if (v) v.muted = true;
    });
    video.muted = !unmute;
    card.classList.toggle("is-unmuted", unmute);
    if (unmute) video.play().catch(() => {});
  });

  /* ---------- Init ---------- */
  $$(".js-ig").forEach((a) => (a.href = igUrl));
  $$(".js-tg").forEach((a) => (a.href = tgUrl()));
  $("#igDm").href = `https://ig.me/m/${CONFIG.instagram}`;
  $$(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

  const params = new URLSearchParams(location.search);
  setLang(params.get("lang") || "uz");
  setMenu(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  if (params.has("order") || params.has("package") || location.hash === "#order") openSheet(params.get("package"));
})();
</script>
</body>
</html>
